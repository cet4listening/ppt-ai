<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幻灯片渲染引擎 · 自测页</title>
<link rel="stylesheet" href="../assets/themes.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #11151c;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e5e7eb;
  }
  body.mode-single { overflow: hidden; background: #05080f; }

  #stage { display: none; width: 1280px; height: 720px; }
  body.mode-single #stage { display: block; position: absolute; inset: 0; }
  body.mode-single #grid { display: none; }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
    padding: 24px;
    max-width: 1440px;
    margin: 0 auto;
  }
  .cell { min-width: 0; }
  .cell .cap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 2px 6px;
    font-size: 12px;
    color: #94a3b8;
  }
  .cell .cap b { color: #e2e8f0; font-weight: 600; }
  .cell .cap em { font-style: normal; font-size: 11px; color: #64748b; }
  .cell .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 18px 50px -30px rgba(0, 0, 0, .8);
  }
  #meta {
    padding: 14px 26px 6px;
    font-size: 12px;
    letter-spacing: .04em;
    color: #7c8aa0;
  }
  #meta b { color: #c7d2fe; font-weight: 600; }
</style>
</head>
<body>
<div id="meta">幻灯片渲染自测 · <b id="meta-style">—</b></div>
<div id="stage"></div>
<div id="grid"></div>

<script src="../assets/presets.js"></script>
<script src="../assets/render.js"></script>
<script>
(function () {
  'use strict';

  /* ---------------- 假数据（覆盖 9 种版式 + 长文本 / 多条目） ---------------- */
  var deck = {
    title: '分数的初步认识',
    subtitle: '三年级数学 · 第一课时',
    meta: { grade: '三年级', subject: '数学', minutes: 40 },
    slides: [
      {
        type: 'cover',
        title: '分数的初步认识',
        subtitle: '把一块月饼平均分给 4 个小朋友，每人分到多少？',
        notes: '用分月饼的真实情境开场，让学生感受“平均分”的必要性。'
      },
      {
        type: 'section',
        title: '认识几分之一',
        subtitle: '从“一半”开始，理解分数的意义',
        notes: '先复习“一半”，再引出二分之一、四分之一。'
      },
      {
        type: 'bullets',
        title: '这节课我们要学会',
        bullets: [
          '认识几分之一，会读、会写简单的分数',
          '理解“平均分”是分数产生的前提',
          '能用分数表示生活中的简单数量关系'
        ]
      },
      {
        type: 'bullets',
        title: '动手做一做：折一折、涂一涂',
        subtitle: '用一张正方形纸折出它的四分之一',
        bullets: [
          '把正方形纸对折一次，得到两个相等的部分',
          '再对折一次，得到四个相等的部分',
          '涂色表示其中的一份，就是四分之一',
          '想一想：还能怎样折？',
          '和同桌说一说你的折法',
          '比一比：谁的折法最多'
        ]
      },
      {
        type: 'bullets',
        title: '课堂练习：判断与表达',
        subtitle: '先独立完成，再小组交流',
        bullets: [
          '下面哪些图形的涂色部分是四分之一？',
          '用分数表示图中涂色部分',
          '把 12 根小棒平均分成 3 份，每份是总数的几分之几',
          '比较二分之一和四分之一的大小',
          '生活中还有哪些地方用到分数',
          '说一说：分数和我们学过的数有什么不同',
          '完成练习册第 12 页第 1—3 题',
          '订正错题，并把理由说给同桌听',
          '整理本节课的收获，写在学习单上'
        ]
      },
      {
        type: 'two-col',
        title: '这样分公平吗？',
        subtitle: '对比两种分法，说说你的理由',
        columns: [
          { title: '平均分', items: ['每份分得同样多', '可以准确用分数表示', '每人得到四分之一'] },
          { title: '不平均分', items: ['每份多少不一样', '不能用四分之一表示', '有人多、有人少'] }
        ]
      },
      {
        type: 'image',
        title: '生活中的分数',
        subtitle: '观察图片，找一找分数',
        image: { caption: '把一张披萨平均分成 8 份，每份是它的八分之一' },
        bullets: ['披萨、蛋糕、巧克力里都藏着分数', '平均分的份数越多，每一份越小', '分数就藏在我们身边']
      },
      {
        type: 'quote',
        quote: '数学是研究数量关系和空间形式的科学。',
        author: '—— 恩格斯'
      },
      {
        type: 'stats',
        title: '同样大的月饼，分给不同人数',
        subtitle: '观察每一份的大小变化',
        stats: [
          { value: '1/2', label: '平均分给 2 人', note: '每人分到一半' },
          { value: '1/4', label: '平均分给 4 人', note: '每人分到四分之一' },
          { value: '1/8', label: '平均分给 8 人', note: '每人分到八分之一' },
          { value: '8', label: '分成的份数', note: '份数越多，每份越小' }
        ]
      },
      {
        type: 'stats',
        title: '课堂小调查',
        subtitle: '我们班同学对分数的掌握情况',
        stats: [
          { value: '92%', label: '能正确读写简单分数' },
          { value: '18', label: '人完成了两种折法' },
          { value: '6', label: '组展示了不同思路' }
        ]
      },
      {
        type: 'list',
        title: '课堂流程',
        subtitle: '40 分钟，一步一步来',
        bullets: [
          '情境导入：分月饼，引出“一半”',
          '动手操作：折纸表示四分之一',
          '合作探究：比较几分之一的大小',
          '巩固练习：判断、涂色、表达',
          '课堂小结：说说你的收获'
        ]
      },
      {
        type: 'list',
        title: '学习任务单',
        subtitle: '按顺序完成，遇到困难先想一想',
        bullets: [
          '任务一：读一读，认识分数各部分名称',
          '任务二：折一折，用纸表示二分之一',
          '任务三：涂一涂，表示四分之一',
          '任务四：比一比，二分之一和四分之一谁大',
          '任务五：说一说，生活中的分数',
          '任务六：练一练，完成课堂练习',
          '任务七：订一订，改正错误并说明理由',
          '任务八：理一理，整理本节课的知识'
        ]
      },
      {
        type: 'end',
        title: '谢谢观看',
        subtitle: '把数学讲成故事，让孩子爱上思考。',
        bullets: ['授课教师：李老师', '联系方式：li@example.com']
      }
    ]
  };

  /* ---------------- URL 参数 ---------------- */
  var q = new URLSearchParams(location.search);
  var styleId = q.get('style') || 'editorial';
  var defaults = {
    editorial: { palette: 'ink', font: 'serif-cn', anim: 'fade-up' },
    corporate: { palette: 'ocean', font: 'sans-cn', anim: 'fade-up' },
    playful: { palette: 'candy', font: 'rounded-cn', anim: 'zoom' },
    tech: { palette: 'violet', font: 'sans-cn', anim: 'wipe' },
    warm: { palette: 'paper', font: 'serif-cn', anim: 'fade' }
  };
  var d = defaults[styleId] || defaults.editorial;
  var theme = {
    styleId: styleId,
    paletteId: q.get('palette') || d.palette,
    fontId: q.get('font') || d.font,
    animId: q.get('anim') || d.anim
  };

  var only = q.get('only');
  var animate = q.get('static') !== '1';
  var stage = document.getElementById('stage');
  var grid = document.getElementById('grid');
  var meta = document.getElementById('meta-style');
  meta.textContent = styleId + ' / ' + theme.paletteId + ' / ' + theme.fontId;

  window.__deck = deck;
  window.__theme = theme;

  if (only) {
    document.body.classList.add('mode-single');
    var index = 0;
    if (/^\d+$/.test(only)) {
      index = parseInt(only, 10);
    } else {
      for (var i = 0; i < deck.slides.length; i++) {
        if (deck.slides[i].type === only) { index = i; break; }
      }
    }
    index = Math.max(0, Math.min(deck.slides.length - 1, index));
    PPT.renderDeck(stage, deck, theme, { mode: 'single', index: index, animate: animate });
    if (q.get('present') === '1') {
      document.body.classList.remove('mode-single');
      PPT.present(deck, theme, index);
    }
  } else {
    deck.slides.forEach(function (s, i) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var cap = document.createElement('div');
      cap.className = 'cap';
      cap.innerHTML = '<span><b>' + (i + 1) + '</b> · ' + s.type + '</span><em>' + (s.title || '') + '</em>';
      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      cell.appendChild(cap);
      cell.appendChild(thumb);
      grid.appendChild(cell);
      PPT.renderThumb(thumb, s, deck, theme);
    });
  }
})();
</script>
</body>
</html>
