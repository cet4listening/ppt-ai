<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>video probe</title>
<style>#state{font:700 14px sans-serif}</style></head>
<body>
<p id="state">running…</p>
<pre id="log"></pre>
<script src="./fixtures.js"></script>
<script>
(function () {
  var rows = [];
  var STEP = 'init';
  function step(s) { STEP = s; window.__STEP = s; }
  function log(k, v) { rows.push({ name: k, ok: true, detail: String(v) }); document.getElementById('log').textContent += k + ' :: ' + v + '\n'; }

  function finish() {
    window.__RESULT = { state: 'PASS', total: rows.length, failed: 0, rows: rows };
  }

  step('start');
  (async function () {
    var fixtures = window.__FIXTURES || {};
    var name = /mp4/.test(location.hash) ? 'clip.mp4' : 'clip.webm';
    var f = fixtures[name];
    log('fixture', name + ' bytes=' + (f ? f.bytes : 'MISSING') + ' mime=' + (f ? f.mime : '-'));
    if (!f) { finish(); return; }
    var bin = atob(f.b64);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var file = new File([u8], name, { type: f.mime });

    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.playsInline = true;
    v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.style.cssText = 'position:fixed;left:0;top:0;width:160px;height:90px;opacity:.01';
    ['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough', 'progress', 'seeking', 'seeked', 'stalled', 'suspend', 'waiting', 'error', 'playing', 'timeupdate'].forEach(function (ev) {
      v.addEventListener(ev, function () {
        log('event', ev + ' readyState=' + v.readyState + ' w=' + v.videoWidth + ' h=' + v.videoHeight + ' t=' + v.currentTime.toFixed(2) + ' dur=' + v.duration + (v.error ? ' err=' + v.error.code + '/' + v.error.message : ''));
      });
    });
    document.body.appendChild(v);
    v.src = url;
    v.load();
    try { var p = v.play(); if (p && p.catch) p.catch(function (e) { log('play-reject', e.name + ': ' + e.message); }); } catch (e) { log('play-throw', e.message); }
    log('canPlayType mp4', v.canPlayType('video/mp4; codecs="avc1.42E01E"'));
    log('canPlayType webm', v.canPlayType('video/webm; codecs="vp9"'));

    for (var round = 0; round < 12; round++) {
      await new Promise(function (r) { setTimeout(r, 400); });
      if (v.readyState >= 2 && v.videoWidth) {
        log('ready-at-round', round + ' readyState=' + v.readyState + ' size=' + v.videoWidth + 'x' + v.videoHeight);
        break;
      }
    }
    // 试画到 canvas
    try {
      var cv = document.createElement('canvas');
      cv.width = 160; cv.height = 90;
      var ctx = cv.getContext('2d');
      ctx.drawImage(v, 0, 0, cv.width, cv.height);
      var d = cv.toDataURL('image/jpeg', 0.8);
      log('canvas draw+toDataURL', 'OK len=' + d.length + ' head=' + d.slice(0, 24));
    } catch (e) {
      log('canvas FAIL', e.name + ': ' + e.message);
    }
    // 再试 seek 到 0.2s 后画
    try {
      v.currentTime = 0.2;
      await new Promise(function (r) { setTimeout(r, 600); });
      var cv2 = document.createElement('canvas');
      cv2.width = 160; cv2.height = 90;
      cv2.getContext('2d').drawImage(v, 0, 0, 160, 90);
      log('seek then draw', 'OK len=' + cv2.toDataURL('image/jpeg', 0.8).length);
    } catch (e) {
      log('seek then draw FAIL', e.name + ': ' + e.message);
    }

    // 也测一下「不 play、preload=metadata」是否能出 loadeddata
    var v2 = document.createElement('video');
    v2.muted = true; v2.preload = 'metadata';
    v2.src = url;
    var evs = [];
    ['loadedmetadata', 'loadeddata', 'canplay', 'error'].forEach(function (ev) {
      v2.addEventListener(ev, function () { evs.push(ev + '(rs=' + v2.readyState + ')'); });
    });
    v2.load();
    await new Promise(function (r) { setTimeout(r, 2500); });
    log('preload=metadata events', evs.join(' ') + ' readyState=' + v2.readyState + ' w=' + v2.videoWidth);

    // 复刻 files.js 里的隐藏 video 方案（2px、opacity 0、preload auto + play）
    var v3 = document.createElement('video');
    v3.muted = true; v3.defaultMuted = true; v3.playsInline = true;
    v3.setAttribute('playsinline', ''); v3.setAttribute('muted', '');
    v3.preload = 'auto';
    v3.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none;';
    var evs3 = [];
    ['loadedmetadata', 'loadeddata', 'canplay', 'seeked', 'timeupdate', 'error', 'stalled', 'suspend', 'waiting', 'playing'].forEach(function (ev) {
      v3.addEventListener(ev, function () {
        evs3.push(ev + '(rs=' + v3.readyState + ',w=' + v3.videoWidth + ',t=' + v3.currentTime.toFixed(2) + (v3.error ? ',err=' + v3.error.code : '') + ')');
      });
    });
    var url3 = URL.createObjectURL(file); // 新的 blob URL，避免命中上面的媒体缓存
    document.body.appendChild(v3);
    v3.src = url3;
    v3.load();
    var played = 'n/a';
    try {
      var p3 = v3.play();
      if (p3 && p3.catch) p3.catch(function (e) { played = 'reject:' + e.name; });
      else played = 'no-promise';
    } catch (e) { played = 'throw:' + e.message; }
    await new Promise(function (r) { setTimeout(r, 3000); });
    log('hidden video (files.js style)', 'play=' + played + ' readyState=' + v3.readyState + ' w=' + v3.videoWidth + ' events=' + evs3.join(' '));

    finish();
  })();
})();
</script>
</body></html>
