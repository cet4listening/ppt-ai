<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>export.js 测试</title>
<style>
  body { font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif; margin: 24px; background:#111; color:#eee; }
  table { border-collapse: collapse; width: 100%; }
  td, th { border: 1px solid #333; padding: 6px 8px; text-align: left; }
  .ok { color:#6ee7a0; } .bad { color:#ff8080; }
  pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>export.js 导出 PPTX 测试</h1>
<p id="state">running…</p>
<table id="out"><thead><tr><th>用例</th><th>结果</th><th>细节</th></tr></thead><tbody></tbody></table>

<script src="../assets/export.js"></script>
<script>
(function () {
  'use strict';
  var RESULTS = [];
  var STATE = 'running';
  var STEP = 'init';
  var BLOBS = {};      // key -> base64
  var STATS = {};      // key -> {size, filename, slides, mode}

  function step(s) { STEP = s; window.__STEP = s; }
  function record(name, ok, detail) {
    RESULTS.push({ name: name, ok: !!ok, detail: String(detail == null ? '' : detail) });
    return !!ok;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function blobToB64(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () {
        var s = String(fr.result);
        resolve(s.slice(s.indexOf(',') + 1));
      };
      fr.onerror = function () { reject(fr.error || new Error('读 blob 失败')); };
      fr.readAsDataURL(blob);
    });
  }

  /* 生成一张测试图片（canvas → dataURL），给 image 页型用 */
  function makeImage() {
    var cv = document.createElement('canvas');
    cv.width = 900; cv.height = 560;
    var ctx = cv.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 900, 560);
    g.addColorStop(0, '#2b5ce6');
    g.addColorStop(1, '#0e6ba8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 900, 560);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 64px "Microsoft YaHei", sans-serif';
    ctx.fillText('直角三角形', 60, 180);
    ctx.font = '36px "Microsoft YaHei", sans-serif';
    ctx.fillText('a^2 + b^2 = c^2', 60, 280);
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(560, 470); ctx.lineTo(860, 470); ctx.lineTo(560, 300); ctx.closePath();
    ctx.stroke();
    return cv.toDataURL('image/png');
  }

  var NOTES = '老师提示：这一页可以用 3 分钟讲完，配合板书推导。';

  function buildDeck(title) {
    var img = makeImage();
    return {
      title: title || '勾股定理（第 1 课时）',
      subtitle: '八年级数学 · 人教版下册',
      meta: { grade: '八年级', subject: '数学', minutes: 45 },
      slides: [
        { type: 'cover', title: '勾股定理', subtitle: '从直角三角形到 a² + b² = c²', notes: NOTES },
        { type: 'section', title: '一、认识直角三角形', subtitle: '边、角与斜边', notes: NOTES },
        {
          type: 'bullets', title: '本节课的学习目标',
          bullets: [
            '理解直角三角形三边之间的关系',
            '掌握勾股定理的内容与几何意义',
            '能用勾股定理求第三边的长度',
            '了解勾股定理的几种经典证明方法',
            '通过拼图活动体会数形结合的数学思想',
            '能识别常见的勾股数：3-4-5、5-12-13',
            '在真实情境中建立直角三角形模型并求解',
            '养成先画图、再计算、后检验的解题习惯'
          ],
          notes: NOTES
        },
        {
          type: 'two-col', title: '两种常见证明思路',
          columns: [
            { title: '面积法', items: ['四个全等直角三角形拼成大正方形', '用两种方式表示大正方形面积', '比较两式即得 a²+b²=c²', '过程直观，适合课堂演示'] },
            { title: '相似三角形法', items: ['作斜边上的高分成两个小三角形', '利用射影定理建立比例式', '推导出同一定理', '对代数基础要求更高'] }
          ],
          notes: NOTES
        },
        {
          type: 'image', title: '图形直观', subtitle: '斜边是直角所对的边',
          image: { src: img, caption: '图 1：直角三角形 ABC，∠C = 90°，AB 为斜边' },
          notes: NOTES
        },
        { type: 'quote', title: '', quote: '数学是研究数量关系与空间形式的科学。', author: '恩格斯《反杜林论》', notes: NOTES },
        {
          type: 'stats', title: '勾股数小档案',
          stats: [
            { value: '3-4-5', label: '最经典的勾股数' },
            { value: '5-12-13', label: '常考的整数组' },
            { value: '8-15-17', label: '进阶练习组' },
            { value: '100+', label: '已知勾股数组' }
          ],
          notes: NOTES
        },
        {
          type: 'list', title: '课堂练习（由易到难）',
          bullets: [
            '已知两直角边 3、4，求斜边',
            '已知斜边 13、一直角边 5，求另一直角边',
            '判断 6、8、10 能否构成直角三角形',
            '一根 2.5 米长的梯子靠墙，底端距墙 0.7 米，求梯子顶端的高度',
            '在方格纸上画出面积为 5 的正方形'
          ],
          notes: NOTES
        },
        { type: 'end', title: '谢谢观看', subtitle: '下节课：勾股定理的逆定理', notes: NOTES }
      ]
    };
  }

  /* ---- image 模式的最小 PPT 渲染桩（真实项目里由 render.js 提供） ---- */
  function installPptStub() {
    window.PPT = {
      renderThumb: function (el, slide, deck) {
        var colors = ['#1f2937', '#0e6ba8', '#2e7d5b', '#a32c63', '#6b3fa0', '#d4552b', '#1b3a6b', '#16736f', '#111318'];
        var bg = colors[(slide && slide.type ? slide.type.length : 0) % colors.length];
        el.innerHTML = '';
        var s = document.createElement('div');
        s.className = 'slide';
        s.style.cssText = 'position:relative;width:1280px;height:720px;overflow:hidden;'
          + 'background:' + bg + ';color:#fff;box-sizing:border-box;padding:72px;'
          + 'font-family:"Microsoft YaHei",sans-serif;';
        var h = document.createElement('div');
        h.style.cssText = 'font-size:64px;font-weight:700;line-height:1.2;';
        h.textContent = (slide && (slide.title || slide.quote)) || '（无标题）';
        s.appendChild(h);
        var sub = document.createElement('div');
        sub.style.cssText = 'margin-top:28px;font-size:32px;opacity:.85;';
        sub.textContent = (slide && (slide.subtitle || slide.author)) || '';
        s.appendChild(sub);
        var foot = document.createElement('div');
        foot.style.cssText = 'position:absolute;left:72px;bottom:48px;font-size:24px;opacity:.7;';
        foot.textContent = (deck && deck.title ? deck.title : '') + ' · 图片版';
        s.appendChild(foot);
        el.appendChild(s);
      }
    };
  }

  async function run() {
    var deck = buildDeck();
    var theme = { styleId: 'editorial', paletteId: 'ink', fontId: 'sans-cn', animId: 'none' };

    /* ---------- 0. 基础环境 ---------- */
    step('0-env');
    record('EXPORTER 已加载', window.EXPORTER && typeof EXPORTER.toPptx === 'function',
      window.EXPORTER ? 'version=' + EXPORTER.version + ', vendor=' + EXPORTER._vendorBase : '缺失');
    record('printPdf 存在', typeof window.EXPORTER.printPdf === 'function', '');
    record('页面未定义 PRESETS（测内置配色回退）', typeof window.PRESETS === 'undefined', '');

    /* ---------- 1. 空 deck 抛中文错误 ---------- */
    step('1-empty');
    try {
      await EXPORTER.toPptx({ slides: [] }, theme, {});
      record('空 deck 抛错', false, '没有抛错');
    } catch (e) {
      var msg = String((e && e.message) || e);
      record('空 deck 抛中文错误', /[\u4e00-\u9fa5]/.test(msg), msg);
    }

    /* ---------- 2. native 模式（无 PRESETS） ---------- */
    step('2-native');
    var t0 = Date.now();
    try {
      var r1 = await EXPORTER.toPptx(deck, theme, { mode: 'native' });
      STATS.nativeNoPresets = { size: r1.size, filename: r1.filename, slides: r1.slides, mode: r1.mode };
      record('native 导出返回 {blob, filename}', r1 && r1.blob instanceof Blob && typeof r1.filename === 'string',
        'size=' + r1.size + ', filename=' + r1.filename + ', slides=' + r1.slides + ', ms=' + (Date.now() - t0));
      record('native blob > 50KB', r1.size > 50 * 1024, r1.size + ' B');
      record('native 页数 = deck 页数', r1.slides === deck.slides.length, r1.slides + ' / ' + deck.slides.length);
      record('文件名 = deck.title + .pptx', r1.filename === deck.title + '.pptx', r1.filename);
      step('2-native-b64');
      BLOBS.native = await blobToB64(r1.blob);
      record('blob 转 base64 成功', BLOBS.native.length > 1000, 'b64 len=' + BLOBS.native.length);
    } catch (e) {
      record('native 导出失败', false, String((e && e.message) || e) + ' | ' + (e && e.stack ? String(e.stack).split('\n')[1] : ''));
    }

    /* ---------- 3. 文件名清洗 ---------- */
    step('3-filename');
    try {
      var badDeck = buildDeck('第1课：勾股定理 / 测试?*"<>| 版');
      badDeck.slides = badDeck.slides.slice(0, 2);
      var name = EXPORTER.filenameFor(badDeck);
      record('非法字符被清洗', !/[\\/:*?"<>|]/.test(name) && /\.pptx$/.test(name), name);
      var noTitle = EXPORTER.filenameFor({ slides: [] });
      record('无标题时兜底文件名', /\.pptx$/.test(noTitle) && noTitle.length > 5, noTitle);
    } catch (e) {
      record('文件名清洗失败', false, String((e && e.message) || e));
    }

    /* ---------- 3b. printPdf 触发打印并清理状态类 ---------- */
    step('3b-print');
    try {
      var printCalls = 0;
      var origPrint = window.print;
      window.print = function () { printCalls++; };
      EXPORTER.printPdf();
      await new Promise(function (r) { setTimeout(r, 400); });
      var duringCls = document.documentElement.classList.contains('pp-printing');
      window.dispatchEvent(new Event('afterprint'));
      await new Promise(function (r) { setTimeout(r, 80); });
      var afterCls = document.documentElement.classList.contains('pp-printing');
      window.print = origPrint;
      record('printPdf 调用 window.print', printCalls === 1, 'print 调用次数=' + printCalls);
      record('printPdf 打印中加 pp-printing、afterprint 后清理', duringCls && !afterCls,
        '打印中=' + duringCls + ', 之后=' + afterCls);
    } catch (e) {
      record('printPdf 失败', false, String((e && e.message) || e));
    }

    /* ---------- 4. theme 解析：PRESETS 优先 ---------- */
    step('4-presets');
    try {
      var T1 = EXPORTER.resolveTheme(theme);
      record('无 PRESETS 时 resolveTheme 有内置配色',
        T1 && T1.colors && /^[0-9A-F]{6}$/.test(T1.colors.bg) && !!T1.fontHeading,
        JSON.stringify({ bg: T1.colors.bg, text: T1.colors.text, primary: T1.colors.primary, font: T1.fontHeading }));

      window.PRESETS = {
        get: function () {
          return {
            style: { id: 'x' },
            palette: { id: 'midnight', colors: { bg: '#0E1117', surface: '#1A212C', text: '#F2F5FA', muted: '#9DA9BA', primary: '#5B8CFF', accent: '#F2B24C', line: '#2A3442' } },
            font: { heading: 'Georgia, serif', body: 'Microsoft YaHei, sans-serif' },
            anim: {}
          };
        }
      };
      var T2 = EXPORTER.resolveTheme(theme);
      record('PRESETS.get 优先且 #hex 被归一化',
        T2.colors.bg === '0E1117' && T2.colors.text === 'F2F5FA',
        'bg=' + T2.colors.bg + ', text=' + T2.colors.text + ', fontHeading=' + T2.fontHeading);

      step('4-presets-native');
      var r2 = await EXPORTER.toPptx(deck, theme, { mode: 'native', filename: '显式文件名/含斜杠.pptx' });
      STATS.nativePresets = { size: r2.size, filename: r2.filename, slides: r2.slides, mode: r2.mode };
      record('PRESETS 深色主题也能导出', r2.size > 50 * 1024, 'size=' + r2.size + ', filename=' + r2.filename);
      record('显式 filename 优先并清洗',
        /\.pptx$/.test(r2.filename) && !/[\\/:*?"<>|]/.test(r2.filename.replace(/\.pptx$/, '')),
        r2.filename);
      BLOBS.nativeDark = await blobToB64(r2.blob);
      record('深色主题导出与浅色不同', BLOBS.native !== BLOBS.nativeDark, '字节不同即通过');
    } catch (e) {
      record('PRESETS 主题路径失败', false, String((e && e.message) || e));
    }

    /* ---------- 5. image 模式（html2canvas + PPT 桩） ---------- */
    step('5-image');
    try {
      installPptStub();
      var t1 = Date.now();
      var r3 = await EXPORTER.toPptx(deck, theme, { mode: 'image', scale: 1 });
      STATS.image = { size: r3.size, filename: r3.filename, slides: r3.slides, mode: r3.mode };
      record('image 模式导出成功', r3 && r3.blob instanceof Blob && r3.size > 50 * 1024,
        'size=' + r3.size + ', slides=' + r3.slides + ', mode=' + r3.mode + ', ms=' + (Date.now() - t1));
      record('image 模式页数正确', r3.slides === deck.slides.length, r3.slides + ' / ' + deck.slides.length);
      step('5-image-b64');
      BLOBS.image = await blobToB64(r3.blob);
      record('image 模式体积合理（每页整页位图）', r3.size > 100 * 1024,
        r3.size + ' B（native 对照 ' + STATS.nativeNoPresets.size + ' B）');
    } catch (e) {
      record('image 模式失败', false, String((e && e.message) || e) + ' | ' + (e && e.stack ? String(e.stack).split('\n')[1] : ''));
    }

    /* ---------- 6. image 模式缺 PPT 模块 → 中文错误 ---------- */
    step('6-image-noptt');
    try {
      delete window.PPT;
      await EXPORTER.toPptx(deck, theme, { mode: 'image' });
      record('缺 PPT 模块应抛错', false, '没有抛错');
    } catch (e) {
      var m2 = String((e && e.message) || e);
      record('缺 PPT 模块抛中文错误', /[\u4e00-\u9fa5]/.test(m2), m2);
    }

    /* ---------- 收尾 ---------- */
    step('done');
    var failed = RESULTS.filter(function (r) { return !r.ok; }).length;
    STATE = failed ? 'FAIL' : 'PASS';
    window.__RESULT = {
      state: STATE, total: RESULTS.length, failed: failed, rows: RESULTS,
      stats: STATS, blobKeys: Object.keys(BLOBS),
      blobLens: Object.keys(BLOBS).map(function (k) { return k + ':' + BLOBS[k].length; }).join(',')
    };
    window.__BLOBS = BLOBS;
    document.getElementById('state').textContent = STATE + ' — ' + (RESULTS.length - failed) + '/' + RESULTS.length + ' 通过';
    document.getElementById('state').className = failed ? 'bad' : 'ok';
    var tb = document.querySelector('#out tbody');
    RESULTS.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + esc(r.name) + '</td><td class="' + (r.ok ? 'ok' : 'bad') + '">'
        + (r.ok ? 'PASS' : 'FAIL') + '</td><td><pre>' + esc(r.detail) + '</pre></td>';
      tb.appendChild(tr);
    });
    return window.__RESULT;
  }

  window.__chunk = function (key, i, n) {
    var s = BLOBS[key] || '';
    return s.slice(i * n, (i + 1) * n);
  };
  window.__blobLen = function (key) { return (BLOBS[key] || '').length; };
  window.__run = run;
  window.__result = function () { return window.__RESULT || { state: STATE, step: STEP }; };

  window.addEventListener('load', function () {
    run()['then'](function () {}, function (e) {
      record('未捕获异常', false, String((e && e.stack) || e));
      var failed = RESULTS.filter(function (r) { return !r.ok; }).length;
      STATE = 'FAIL';
      window.__RESULT = { state: 'FAIL', total: RESULTS.length, failed: failed, rows: RESULTS, step: STEP };
    });
  });
})();
</script>
</body>
</html>
